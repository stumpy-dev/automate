name: Check Free-Threaded Python
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
permissions:
  contents: read
jobs:
  get_max_python_version:
    runs-on: ubuntu-latest
    outputs:
      max_python_version: ${{ steps.get-python.outputs.max_python_version }}
    steps:
      - name: Checkout STUMPY
        uses: actions/checkout@v4
        with:
          repository: stumpy-dev/stumpy
      - name: Upgrade Pip, Install Minimum Requirements
        run: python -m pip install --upgrade pip pandas lxml packaging docutils
        shell: bash
      - name: Get maximum Python version
        id: get-python
        run: |
          MAX_PYTHON=$(python ./versions.py -mode max | grep '^python:' | awk '{print $2}')
          echo "max_python_version=\"$MAX_PYTHON\"" >> "$GITHUB_OUTPUT"
        shell: bash
  check_free_threaded_python:
    needs: get_max_python_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STUMPY
        uses: actions/checkout@v4
        with:
          repository: stumpy-dev/stumpy
      - name: Set Up Free-Threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJSON(needs.get_max_python_version.outputs.max_python_version) }}
          freethreaded: true
          check-latest: true
      - name: Install STUMPY and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[ci]'
      - name: Verify free-threaded Python with the GIL disabled
        shell: python
        run: |
          import sys
          import sysconfig

          print(sys.version, flush=True)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1, "Expected a free-threaded Python build"
          assert not sys._is_gil_enabled(), "Expected a free-threaded interpreter with the GIL disabled"
      - name: Run Unit Tests
        env:
          # Avoid crashes in Dask's frame-sampling profiler on free-threaded Python.
          DASK_DISTRIBUTED__WORKER__PROFILE__ENABLED: 'false'
        run: ./test.sh unit
        shell: bash
