name: Enforce PR Template

on:
  pull_request_target:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  validate-body:
    runs-on: ubuntu-latest
    # Triggers only if the PR body DOES NOT contain the exact string
    if: |
      !contains(github.event.pull_request.body, '# Pull Request Checklist')
    steps:
      - name: Close Invalid Pull Request
        run: |
          gh pr close "$PR_NUMBER" --comment "$COMMENT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: >
            This pull request was closed because it does not include the required '# Pull Request Checklist' section. 
            Please update your description and reopen the pull request.
